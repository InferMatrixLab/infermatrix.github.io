<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">vLLM Router: documented request and backend architecture</title>
<desc id="desc">OpenAI-compatible HTTP requests enter vLLM Router. Native request-level routing or explicitly enabled Program scheduling determines placement. The router manages discovery, health, retries and metrics. A deployment uses a homogeneous HTTP or gRPC worker pool. HTTP proxies OpenAI requests. The gRPC path renders and tokenizes chat, sends token IDs using Inference.GenerateStream, and adapts output to OpenAI JSON or SSE. Diagram redrawn from official documentation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4276a8" stroke-width="1.8"/></marker>
