<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">InferRSI — evidence-driven inference optimization</title><desc id="desc">User and coding agent supply code changes and benchmark commands. Immutable run specification feeds the experiment harness, composed with model contracts and execution infrastructure. Performance and quality gates produce evidence and reusable knowledge. Automatic planning is not claimed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1931"/><stop offset="1" stop-color="#060d1c"/></linearGradient><linearGradient id="accent"><stop stop-color="#277af8"/><stop offset="1" stop-color="#3fdde8"/></linearGradient><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#264663" stroke-opacity=".24"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#50bedf" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fe}.k{font-family:Consolas,monospace;font-size:23px;letter-spacing:2px;fill:#74cde8}.h{font-size:36px;font-weight:700}.b{font-size:27px;fill:#b7c9df}.s{font-size:24px;fill:#96aec9}.flow{fill:none;stroke:#50bedf;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1800" height="1120" rx="24" fill="url(#bg)"/><rect width="1800" height="1120" rx="24" fill="url(#grid)"/><rect x="64" y="62" width="6" height="65" rx="3" fill="url(#accent)"/><text x="96" y="87" class="k">INFERRSI / OPTIMIZATION WORKBENCH</text><text x="96" y="135" font-size="43" font-weight="700">Measure. Verify. Learn. Repeat.</text>
<rect x="64" y="190" width="780" height="194" rx="16" fill="#0d1c32" stroke="#277af8" stroke-opacity=".7" stroke-width="2"/><text x="92" y="229" class="k">01 / USER + CODING AGENT</text><text x="92" y="278" class="h">Profile &amp; propose</text>
<text x="92" y="321" class="b">Code changes + benchmark / validation commands</text>
