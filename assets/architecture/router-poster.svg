<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="title desc">
<title id="title">vLLM Router — faithful redraw of poster panel 03</title>
<desc id="desc">Poster architecture with API Server, three APIs, Workflow Profiler, Worker Monitor, Global Scheduler containing DP/PD Aware, Agent Aware and Cache Aware, Tokenizer and Token Cache, HTTP/ZMQ/gRPC transport, and HTTP and ZMQ/gRPC workers. Three tiny source annotations are omitted because they cannot be read reliably in the provided poster. This reproduces the poster concept and is not a statement of current implementation.</desc>
